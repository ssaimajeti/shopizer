version: 2.1

orbs:
  slack: circleci/slack@3.4.2

executors:
  shopizer-ci:
    docker:
      - image: shopizerecomm/ci:java11
        auth:
          username: shopizerecomm
          password: $DOCKERHUB_PASSWORD  
      
working_directory: /tmp

jobs:
  lint:
    executor: shopizer-ci
    steps:
      - checkout
      - run:
          name: Run Mvn Checkstyle
          command: mvn checkstyle:check

  test:
    executor: shopizer-ci
    steps:
      - checkout
      - run:
          name: Run Tests
          command: mvn test
  
  build:
    executor: shopizer-ci
    steps:
      - checkout
      - run:
          name: Build Application
          command: mvn clean install
      - persist_to_workspace:
          root: .
          paths:
            - ./sm-shop

  sast_scan:
    executor: shopizer-ci
    steps:
      - checkout
      - run:
          name: Run SAST Scan
          command: |
            echo "Static Application Security Testing not setup, skipping..."

  deploy:
    machine: true
    steps:
       - attach_workspace:
          at: .
       - run:
           name: list files in repo
           command: ls -al
           working_directory: .
       - run:
           name: list files in shop
           command: ls -al
           working_directory: ./sm-shop
       - run:
           name: list files in shop/target
           command: ls -al
           working_directory: ./sm-shop/target
       - run: |
           docker login -u shopizerecomm -p $DOCKERHUB_PASSWORD
       - run: |
           (cd sm-shop && docker build . -t shopizerecomm/shopizer:3.2.3)
       - run:
           name: push image
           command: docker push shopizerecomm/shopizer:3.2.3

workflows:
  build_and_deploy:
    jobs:
      - lint
      - test
      - build:
          requires:
            - lint
            - test
      - sast_scan
      - deploy:
          requires:
            - build