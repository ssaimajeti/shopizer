version: 2.1

orbs:
  slack: circleci/slack@3.4.2

executors:
  shopizer-ci:
    docker:
      - image: shopizerecomm/ci:java17
        auth:
          username: shopizerecomm
          password: $DOCKERHUB_PASSWORD

working_directory: /tmp

jobs:
  build:
    executor: shopizer-ci
    steps:
      - checkout
      - run: echo "shopizer build and test (1)"
      - run:
          name: Run shell script
          command: |
            set -x
            ./mvnw clean test
      - persist_to_workspace:
          root: .
          paths:
            - ./sm-shop

  deploy:
    machine: true
    steps:
      - attach_workspace:
          at: .
      - run:
          name: list files in repo
          command: ls -al
          working_directory: .
      - run:
          name: list files in shop
          command: ls -al
          working_directory: ./sm-shop
      - run:
          name: list files in shop/target
          command: ls -al
          working_directory: ./sm-shop/target
      - run: |
          docker login -u shopizerecomm -p $DOCKERHUB_PASSWORD
      - run: |
          (cd sm-shop && docker build . -t shopizerecomm/shopizer:3.2.3)
      - run:
          name: push image
          command: docker push shopizerecomm/shopizer:3.2.3

workflows:
  build_and_deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build

# Note: The docker image in the executor has been updated to support Java 17, needed for Spring Boot 3.2.3.
# The Maven build step now uses Maven wrapper with 'mvnw' to clean and test, ensuring compatibility with upgraded dependencies.