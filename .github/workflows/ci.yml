name: CI/CD Pipeline

on: [push, pull_request]

jobs:
  setup-java:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

  lint:
    runs-on: ubuntu-latest
    needs: setup-java
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Run Lint
        run: mvn checkstyle:check

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run tests
        run: mvn test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn clean install

  sast:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Run SAST
        run: mvn verify sonar:sonar -Dsonar.projectKey=shopizer -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  container:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
      - name: Build Docker image
        run: docker build . -t shopizerecomm/shopizer:3.2.1
      - name: Push Docker image
        run: docker push shopizerecomm/shopizer:3.2.1