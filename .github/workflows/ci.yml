name: Java CI with Maven

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Lint with Maven (validate)
        run: ./mvnw validate

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run unit tests
        run: ./mvnw test

      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Archive JAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: shopizer-jars
          path: '**/target/*.jar'

  sast:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: SAST with SpotBugs
        run: ./mvnw com.github.spotbugs:spotbugs-maven-plugin:3.1.8:check || true

      - name: Archive SpotBugs report
        uses: actions/upload-artifact@v3
        with:
          name: spotbugs-report
          path: '**/target/spotbugsXml.xml'