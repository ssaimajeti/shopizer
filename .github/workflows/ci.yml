version: 2.1

orbs:
  slack: circleci/slack@3.4.2

executors:
  shopizer-ci:
    docker:
      - image: shopizerecomm/ci:java-3.2.3
        auth:
          username: shopizerecomm
          password: $DOCKERHUB_PASSWORD

working_directory: /tmp

jobs:
  lint:
    executor: shopizer-ci
    steps:
      - checkout
      - run:
          name: Lint Code
          command: mvn checkstyle:check

  unit_tests:
    executor: shopizer-ci
    steps:
      - checkout
      - run:
          name: Run Unit Tests
          command: mvn test

  build:
    executor: shopizer-ci
    steps:
      - checkout
      - run: echo "shopizer build and test"
      - run:
          name: Compile and Run Tests
          command: mvn clean install
      - persist_to_workspace:
          root: .
          paths:
            - ./sm-shop

  deploy:
    machine: true
    steps:
       - attach_workspace:
          at: .
       # start proprietary DB using private Docker image
       # with credentials stored in the UI
       - run:
           name: List Repo Files
           command: ls -al
           working_directory: .
       - run:
           name: List Shop Files
           command: ls -al
           working_directory: ./sm-shop
       - run:
           name: List Shop/Target Files
           command: ls -al
           working_directory: ./sm-shop/target
       - run: |
           docker login -u shopizerecomm -p $DOCKERHUB_PASSWORD
       - run: |
           (cd sm-shop && docker build . -t shopizerecomm/shopizer:3.2.3)
       - run:
           name: Push Image
           command: docker push shopizerecomm/shopizer:3.2.3

  sast:
    executor: shopizer-ci
    steps:
      - checkout
      - run:
          name: Run SAST Scan
          command: mvn dependency-check:aggregate

workflows:
  build_and_deploy:
    jobs:
      - lint
      - unit_tests
      - build
      - deploy:
          requires:
            - build
      - sast:
          requires:
            - build