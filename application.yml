FROM eclipse-temurin:17-jdk-alpine
# Changed base image from adoptopenjdk/openjdk11-openj9:alpine to eclipse-temurin:17-jdk-alpine for Java 17 LTS support

RUN mkdir /opt/app
RUN mkdir /files
COPY target/shopizer.jar /opt/app
COPY SALESMANAGER.h2.db /
COPY ./files /files
CMD ["java", "-jar", "/opt/app/shopizer.jar"]