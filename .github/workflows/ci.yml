version: 2.1

orbs:
  slack: circleci/slack@3.4.2

executors:
  shopizer-ci:
    docker:
      - image: shopizerecomm/ci:java17 # Updated for Java 17 compatibility with Spring Boot 3.2.3
        auth:
          username: shopizerecomm
          password: $DOCKERHUB_PASSWORD  
      
working_directory: /tmp

jobs:
  lint:
    executor: shopizer-ci
    steps:
      - checkout
      - run:
          name: Lint Code
          command: mvnw spotless:check
          
  test:
    executor: shopizer-ci
    steps:
      - checkout
      - run:
          name: Run Unit Tests
          command: mvnw test

  build:
    executor: shopizer-ci
    steps:
      - checkout
      - run:
          name: Build Package
          command: mvnw clean package
      - persist_to_workspace:
          root: .
          paths:
            - ./sm-shop

  sast:
    executor: shopizer-ci
    steps:
      - checkout
      - run:
          name: Security Scan
          command: mvnw dependency-check:aggregate
      
  deploy:
    machine: true
    steps:
      - attach_workspace:
          at: .
      - run:
          name: list files in repo
          command: ls -al
          working_directory: .
      - run:
          name: list files in shop
          command: ls -al
          working_directory: ./sm-shop
      - run: 
          name: login to docker
          command: docker login -u shopizerecomm -p $DOCKERHUB_PASSWORD
      - run: 
          command: |
            (cd sm-shop && docker build . -t shopizerecomm/shopizer:3.2.3)
      - run:
          name: push image
          command: docker push shopizerecomm/shopizer:3.2.3

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - lint
      - test
      - build:
          requires:
            - lint
            - test
      - sast:
          requires:
            - build
          filters:
            branches:
              only: master
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master