name: CI

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 3.2.6
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '3.2.6'

      - name: Lint (spotbugs)
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:3.1.8:check

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 3.2.6
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '3.2.6'

      - name: Run unit tests
        run: mvn -B test

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: junit-results
          path: '**/target/surefire-reports/*.xml'

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 3.2.6
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '3.2.6'

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload built artifact
        uses: actions/upload-artifact@v3
        with:
          name: shopizer-jar
          path: sm-shop/target/shopizer.jar

  sast:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 3.2.6
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '3.2.6'

      - name: Run static analysis (SAST)
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:3.1.8:check