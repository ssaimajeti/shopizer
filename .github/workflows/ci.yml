version: 2.1

orbs:
  slack: circleci/slack@3.4.2

executors:
  shopizer-ci:
    docker:
      - image: shopizerecomm/ci:java11
        auth:
          username: shopizerecomm
          password: $DOCKERHUB_PASSWORD

working_directory: /tmp

# Define the jobs we want to run for this project
jobs:
  lint:
    executor: shopizer-ci
    steps:
      - checkout
      - run:
          name: Run Lint
          command: mvn checkstyle:check

  test:
    executor: shopizer-ci
    steps:
      - checkout
      - run:
          name: Run Unit Tests
          command: mvn test

  build:
    executor: shopizer-ci
    steps:
      - checkout
      - run:
          name: Run Build
          command: mvn clean install
      - persist_to_workspace:
          root: .
          paths:
            - ./sm-shop

  sast:
    executor: shopizer-ci
    steps:
      - checkout
      - run:
          name: Run SAST
          command: echo "Static Application Security Testing placeholder" # Replace with actual SAST tool if applicable

  deploy:
    machine: true
    steps:
       - attach_workspace:
          at: .
       - run:
           name: List files in repo
           command: ls -al
           working_directory: .
       - run:
           name: List files in shop
           command: ls -al
           working_directory: ./sm-shop
       - run:
           name: List files in shop/target
           command: ls -al
           working_directory: ./sm-shop/target
       - run: |
           docker login -u shopizerecomm -p $DOCKERHUB_PASSWORD
       - run: |
           (cd sm-shop && docker build . -t shopizerecomm/shopizer:3.2.1)
       - run:
           name: Push image
           command: docker push shopizerecomm/shopizer:3.2.1

# Orchestrate our job run sequence
workflows:
  build_and_deploy:
    jobs:
      - lint
      - test
      - build:
          requires:
            - lint
            - test
      - sast:
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - develop
      - deploy:
          requires:
            - build
          filters:
            branches:
              only:
                - main